    <div id="setting-container" class="hidden">
      <button
        id="btn-toggle-settings"
        class="icon-trigger"
        title="Settings"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>

      <div id="setting-drawer" class="hidden">
        <div id="drawer-header">
          <div id="sync-widget" class="sync-widget compact">
            <div id="sync-actions" class="sync-actions">
              <span id="sync-status-icon" class="sync-status-icon" title="Sync Status">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle></svg>
              </span>
              <button id="btn-sync-login" class="icon-only-btn" title="Google Sync">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg>
              </button>
              <div id="sync-manual-controls" class="hidden">
                <button id="btn-sync-push" class="icon-only-btn" title="Push to Cloud">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </button>
                <button id="btn-sync-pull" class="icon-only-btn" title="Pull from Cloud">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                </button>
                <button id="btn-sync-logout" class="icon-only-btn" title="Logout Sync" style="color: var(--text-muted);">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                </button>
              </div>
            </div>
            <div id="sync-input-area" class="hidden sync-input-area">
              <input type="text" id="sync-client-id" placeholder="Paste Client ID here..." class="sync-id-input">
              <button id="btn-sync-connect" class="text-btn sync-connect-btn">Connect</button>
            </div>
          </div>
        </div>

        <div id="drawer-body">
          <div class="toggle-item">
            <div style="display: flex; align-items: center;">
              <span class="toggle-label">Edge Navigation</span>
              <span class="tooltip-trigger" data-tooltip-id="edge-nav">?</span>
            </div>
            <label class="switch">
              <input type="checkbox" id="toggle-edge-nav" checked>
              <span class="slider"></span>
            </label>
          </div>

          <!-- [NEW] Auto-Switch Threshold Slider -->
          <div class="setting-item-block">
            <div class="setting-label-row">
                <span class="toggle-label">Comment Auto-Switch Range</span>
                <span id="label-auto-switch-threshold" class="setting-value-badge">40%</span>
            </div>
            <div class="setting-input-row">
                <input type="range" id="input-auto-switch-threshold" min="0" max="90" step="5" value="40" class="setting-range-slider">
            </div>
            <div class="setting-help-text">Controls how far a comment must travel from bottom before activating.</div>
          </div>
        </div>

        <div id="drawer-footer">
          <div class="zoom-widget">
            <button
              id="btn-font-decrease"
              class="icon-only-btn"
              title="Decrease Font Size"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
            <span id="font-size-label" class="zoom-label">Aa</span>
            <button
              id="btn-font-increase"
              class="icon-only-btn"
              title="Increase Font Size"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </div>

          <div class="offline-widget">
            <button id="btn-download-offline" class="offline-main-btn">
              <span class="label">Make Offline</span>
              <span class="icon">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
              </span>
            </button>

            <button
              id="btn-update-offline"
              class="icon-only-btn hidden"
              title="Check for Updates"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path
                  d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
                ></path>
              </svg>
            </button>
          </div>

          <div class="theme-toggle-group">
            <button
              id="btn-theme-toggle"
              title="Toggle Theme (Double-tap for Sepia)"
            >
              <span class="icon-moon">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                  ></path>
                </svg>
              </span>
              <span class="icon-sun hidden">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="5"></circle>
                  <line x1="12" y1="1" x2="12" y2="3"></line>
                  <line x1="12" y1="21" x2="12" y2="23"></line>
                  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                  <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                  <line x1="1" y1="12" x2="3" y2="12"></line>
                  <line x1="21" y1="12" x2="23" y2="12"></line>
                  <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                  <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
              </span>
            </button>

            <!-- [NEW] Sepia Indicator Button -->
            <button id="btn-sepia-indicator" class="text-btn sepia-indicator" title="Sepia Intensity">0%</button>
          </div>
        </div>
      </div>
    </div>

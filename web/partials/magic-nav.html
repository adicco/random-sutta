    <div
      id="magic-nav-wrapper"
      class="hidden collapsed"
      title="Open Navigation"
    >
      <div id="magic-nav-corner" class="magic-btn" title="Collapse Menu">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </div>

      <div id="magic-group">
        <div id="btn-save-bookmark" class="magic-btn" title="Save Bookmark" style="opacity: 1; padding: 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        </div>
        
        <div id="btn-magic-toc" class="magic-btn" title="Table of Contents">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </div>

        <div id="magic-breadcrumb-bar"></div>
      </div>
    </div> <!-- Close magic-nav-wrapper -->

    <div id="magic-toc-drawer">
      <div id="magic-toc-tabs" class="lookup-header-tabs">
        <button id="tab-magic-nav" class="lookup-tab active">Contents</button>
        <button id="tab-magic-bookmarks" class="lookup-tab">Bookmarks</button>
        <button id="tab-magic-read" class="lookup-tab">Read</button>
      </div>
      <div id="magic-toc-content" class="magic-tab-content">
        <!-- JS generates TOC here -->
      </div>
      <div id="magic-headings-content" class="magic-tab-content hidden">
        <ul id="magic-headings-list" class="headings-list"></ul>
      </div>
      <div id="magic-bookmarks-content" class="magic-tab-content hidden">
        <div id="bookmarks-list"></div>
      </div>
      <div id="magic-read-content" class="magic-tab-content hidden">
        <div id="read-list"></div>
      </div>
      <div id="magic-toc-footer">
        <div class="toc-footer-group">
          <button id="btn-magic-toggle-topics" class="toc-footer-btn" title="Switch between Contents and Headings">
             <!-- Mode TOC icon (Tree) -->
             <svg class="icon-toc" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18M3 15h18M3 21h18M3 3h18"/></svg>
             <!-- Mode Headings icon (List) -->
             <svg class="icon-headings" style="display:none" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          </button>
          <div class="footer-divider" style="width: 1px; height: 16px; background: var(--border-light); margin: 0 5px;"></div>
          <button class="toc-footer-btn" data-action="toc-level-minus" title="Collapse one level">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <button class="toc-footer-btn" data-action="toc-collapse-all" title="Collapse All">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/></svg>
          </button>
          <button class="toc-footer-btn" data-action="toc-level-plus" title="Expand one level">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </div>
      <div id="magic-toc-resize-handle"></div>
    </div>
    <div id="magic-backdrop" class="hidden"></div>

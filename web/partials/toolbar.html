    <!-- Global Toolbar & Trigger -->
    <button id="magic-toolbar-trigger" title="Global Toolbar"></button>

    <div id="global-toolbar" class="hidden">
      <div class="toolbar-search-container">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; color: var(--text-muted);">
          <circle cx="11" cy="11" r="8"></circle>

        </svg>
        <input type="text" id="toolbar-search-input" class="toolbar-search-input" placeholder="Find in page..." autocomplete="off">
        <span id="toolbar-search-info" class="toolbar-search-info">0/0</span>

      <button id="toolbar-search-prev" class="toolbar-nav-btn" title="Previous (Shift+Enter)" disabled>
